<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThatFootball12 — Link Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0D0D0D;
    --panel:#18140F;
    --panel-line:#2A2620;
    --gold:#D4A017;
    --crimson:#C8102E;
    --bone:#F3EFE6;
    --bone-dim:#B8B2A4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--bone);
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
    background-image: radial-gradient(circle at 15% 0%, rgba(212,160,23,0.08), transparent 40%), radial-gradient(circle at 90% 20%, rgba(200,16,46,0.08), transparent 45%);
  }
  .wrap{width:100%;max-width:480px;}
  .hero{
    width:100%; height:220px; background-size:cover; background-position:center;
    border-radius:16px; margin-bottom:24px; border:3px solid var(--panel-line);
  }
  .card{
    background:var(--panel); border:1px solid var(--panel-line); border-radius:12px;
    padding:18px; margin-bottom:14px; transition:all .2s ease;
  }
  .card:hover{ border-color:var(--gold); transform:translateY(-3px); }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero" style="background-image: url('cover.jpg');"></div>

  <header style="text-align:center; margin-bottom:32px;">
    <h1 style="font-family:'Anton',sans-serif; font-size:42px; color:var(--bone);">THAT<span style="color:var(--gold);">FOOTBALL</span>12</h1>
    <p style="color:var(--bone-dim); margin-top:8px;">NFL Style &amp; Gear</p>
  </header>

  <div class="card">

    <a href="casual-fit-july-14/" style="display:block; padding:12px; background:#1F1A13; border-radius:8px; margin-bottom:8px; color:white; text-decoration:none;">→ Everyday Casual Fit Check</a>
    <a href="gameday-fit-july-14/" style="display:block; padding:12px; background:#1F1A13; border-radius:8px; margin-bottom:8px; color:white; text-decoration:none;">→ Gameday Fit Check</a>
  </div>

  <div class="card" style="text-align:center;">
    <a href="archive/" style="color:var(--gold); font-weight:600; text-decoration:none;">View Full Archive → All Past Videos</a>
  </div>

</div>
