name: Weekly Affiliate Link Check

# Distinct from "Weekly Broken Link Check" (link-check.yml), which uses
# lychee against every .html file's links generically. This workflow
# checks whether each SHEIN product in products.json is still listed, by
# its plain ca.shein.com product page, never the affiliate link (Amazon
# and Awin aren't checked). It commits data/dead_links.json when it
# changes (the outfit generator leaves out confirmed-dead products) and
# opens or updates one tracking issue. See check_affiliate_links.py.

on:
  schedule:
    # Runs every Monday at 10:00 AM UTC — an hour after the general
    # broken-link check, so their issues don't land at the same time.
    - cron: '0 10 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: affiliate-link-check
  cancel-in-progress: false

jobs:
  check-affiliate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run affiliate link check
        id: check
        run: python3 check_affiliate_links.py
        continue-on-error: true

      - name: Commit data/dead_links.json if it changed
        run: |
          git add data/dead_links.json
          if git diff --cached --quiet; then
            echo "data/dead_links.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update dead links [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Ensure tracking label exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create affiliate-link-check \
            --description "Weekly affiliate outbound-link health check" \
            --color "B60205" \
            --force

      - name: Open or update tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Weekly affiliate link check"
          BODY_FILE="link_check_report.md"

          EXISTING=$(gh issue list --label affiliate-link-check --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit "$EXISTING" --body-file "$BODY_FILE"
          else
            echo "Creating new issue"
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label affiliate-link-check
          fi
