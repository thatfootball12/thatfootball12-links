  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--bone);font-family:'Poppins',sans-serif;min-height:100vh;display:flex;justify-content:center;padding:32px 16px 64px;}

  h1{font-family:'Anton',sans-serif;font-size:40px;line-height:.95;text-transform:uppercase;}
  h1 span{color:var(--gold);}
  .tagline{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--bone-dim);margin-top:8px;}
  a.card{display:block;background:var(--panel);border:1px solid #2A2620;border-radius:12px;padding:18px;margin-bottom:12px;text-decoration:none;color:var(--bone);transition:.2s;}
  a.card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .card-title{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;text-transform:uppercase;margin-bottom:4px;}
  .card-price{color:var(--gold);font-size:14px;font-weight:500;}
